<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LCU Cinemas</title>
    <link href="../css/style.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4 mt-5">
                <div class="card bg-secondary text-white shadow">
                    <div class="card-body p-4">
                        <h3 class="card-title text-center mb-4">LCU Cinemas Login</h3>
                        <form action="../Controller/auth.php" method="POST">
                            <input type="hidden" name="action" value="login">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <button type="submit" class="btn btn-warning w-100 fw-bold">Login</button>
                        </form>
                        <div class="mt-3 text-center">
                            <a href="register.html" class="text-warning text-decoration-none">New user? Register here</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
